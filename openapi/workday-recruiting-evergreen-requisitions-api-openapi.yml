openapi: 3.1.0
info:
  title: Workday Recruiting REST Applicants Evergreen Requisitions API
  description: RESTful API for managing recruiting operations within Workday Human Capital Management. Provides programmatic access to job requisitions, candidates, job applications, job postings, interviews, and hiring workflows. Supports integration with external talent management and applicant tracking systems using OAuth 2.0 authentication and JSON data format.
  version: v41.2
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/services/support.html
  termsOfService: https://www.workday.com/en-us/legal.html
  x-generated-from: documentation
  x-source-url: https://community.workday.com/sites/default/files/file-hosting/restapi/index.html
  x-last-validated: '2026-05-03'
servers:
- url: https://{tenant}.workday.com/ccx/api/recruiting/v41.2
  description: Workday Recruiting Production
  variables:
    tenant:
      description: Workday tenant identifier (e.g., wd2-impl-services1)
      default: your-tenant
security:
- oauth2: []
tags:
- name: Evergreen Requisitions
  description: Manage evergreen requisitions used for ongoing hiring needs without a specific number of openings or close date.
paths:
  /evergreenRequisitions:
    get:
      operationId: listEvergreenRequisitions
      summary: Workday Recruiting List Evergreen Requisitions
      description: Retrieve a collection of evergreen requisitions. Evergreen requisitions represent ongoing hiring needs without a specific number of openings or anticipated close date.
      tags:
      - Evergreen Requisitions
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Evergreen requisitions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of matching evergreen requisitions
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvergreenRequisition'
              examples:
                ListEvergreenRequisitions200Example:
                  summary: Default listEvergreenRequisitions 200 response
                  x-microcks-default: true
                  value:
                    total: 3
                    data:
                    - id: 11111111-2222-3333-4444-555555555555
                      requisitionNumber: REQ-100245
                      title: Senior Software Engineer
                      status: Open
                      jobProfile:
                        id: 11111111-2222-3333-4444-555555555555
                        descriptor: Senior Software Engineer
                      supervisoryOrganization:
                        id: 11111111-2222-3333-4444-555555555555
                        descriptor: Senior Software Engineer
                      hiringManager:
                        id: 11111111-2222-3333-4444-555555555555
                        descriptor: Senior Software Engineer
                      linkedJobRequisitions:
                      - id: 11111111-2222-3333-4444-555555555555
                        descriptor: Senior Software Engineer
                      createdOn: '2026-05-03T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createEvergreenRequisition
      summary: Workday Recruiting Create an Evergreen Requisition
      description: Create a new evergreen requisition for ongoing hiring needs. Evergreen requisitions remain open indefinitely and can be linked to standard job requisitions for candidate pipeline management.
      tags:
      - Evergreen Requisitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvergreenRequisitionCreate'
            examples:
              CreateEvergreenRequisitionRequestExample:
                summary: Default createEvergreenRequisition request
                x-microcks-default: true
                value:
                  title: Senior Software Engineer
                  jobProfile:
                    id: 11111111-2222-3333-4444-555555555555
                    descriptor: Senior Software Engineer
                  supervisoryOrganization:
                    id: 11111111-2222-3333-4444-555555555555
                    descriptor: Senior Software Engineer
                  hiringManager:
                    id: 11111111-2222-3333-4444-555555555555
                    descriptor: Senior Software Engineer
      responses:
        '201':
          description: Evergreen requisition created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvergreenRequisition'
              examples:
                CreateEvergreenRequisition201Example:
                  summary: Default createEvergreenRequisition 201 response
                  x-microcks-default: true
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    requisitionNumber: REQ-100245
                    title: Senior Software Engineer
                    status: Open
                    jobProfile:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    supervisoryOrganization:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    hiringManager:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    linkedJobRequisitions:
                    - id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    createdOn: '2026-05-03T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /evergreenRequisitions/{id}:
    get:
      operationId: getEvergreenRequisition
      summary: Workday Recruiting Get an Evergreen Requisition
      description: Retrieve detailed information for a specific evergreen requisition including position reference, linked job requisitions, and candidate pipeline status.
      tags:
      - Evergreen Requisitions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Evergreen requisition retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvergreenRequisition'
              examples:
                GetEvergreenRequisition200Example:
                  summary: Default getEvergreenRequisition 200 response
                  x-microcks-default: true
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    requisitionNumber: REQ-100245
                    title: Senior Software Engineer
                    status: Open
                    jobProfile:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    supervisoryOrganization:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    hiringManager:
                      id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    linkedJobRequisitions:
                    - id: 11111111-2222-3333-4444-555555555555
                      descriptor: Senior Software Engineer
                    createdOn: '2026-05-03T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /evergreenRequisitions/{id}/close:
    post:
      operationId: closeEvergreenRequisition
      summary: Workday Recruiting Close an Evergreen Requisition
      description: Close an evergreen requisition that has no pending events. Closing removes the requisition from active recruiting workflows.
      tags:
      - Evergreen Requisitions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Evergreen requisition closed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    EvergreenRequisitionCreate:
      type: object
      description: Request body for creating an evergreen requisition
      required:
      - title
      - jobProfile
      - supervisoryOrganization
      properties:
        title:
          type: string
          description: Evergreen requisition title
          example: Senior Software Engineer
        jobProfile:
          $ref: '#/components/schemas/Reference'
          description: Job profile to associate
        supervisoryOrganization:
          $ref: '#/components/schemas/Reference'
          description: Supervisory organization
        hiringManager:
          $ref: '#/components/schemas/Reference'
          description: Hiring manager
    EvergreenRequisition:
      type: object
      description: An evergreen requisition represents an ongoing hiring need without a specific number of openings or close date, used to maintain a continuous candidate pipeline.
      properties:
        id:
          type: string
          description: Workday ID (WID) uniquely identifying the evergreen requisition
          example: 11111111-2222-3333-4444-555555555555
        requisitionNumber:
          type: string
          description: System-generated requisition reference number
          example: REQ-100245
        title:
          type: string
          description: Evergreen requisition title
          example: Senior Software Engineer
        status:
          type: string
          enum:
          - Open
          - Closed
          description: Current status of the evergreen requisition
          example: Open
        jobProfile:
          $ref: '#/components/schemas/Reference'
          description: Job profile associated with the requisition
        supervisoryOrganization:
          $ref: '#/components/schemas/Reference'
          description: Supervisory organization
        hiringManager:
          $ref: '#/components/schemas/Reference'
          description: Hiring manager
        linkedJobRequisitions:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
          description: Job requisitions linked to this evergreen requisition
        createdOn:
          type: string
          format: date-time
          description: Timestamp when the requisition was created
          example: '2026-05-03T14:30:00Z'
    Error:
      type: object
      description: API error response
      properties:
        error:
          type: string
          description: Error code
          example: string
        message:
          type: string
          description: Human-readable error message
          example: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error
                example: string
              message:
                type: string
                description: Description of the field-level error
                example: string
    Reference:
      type: object
      description: A reference to a related Workday resource
      properties:
        id:
          type: string
          description: Workday ID (WID) of the referenced resource
          example: 11111111-2222-3333-4444-555555555555
        descriptor:
          type: string
          description: Display name of the referenced resource
          example: Senior Software Engineer
  parameters:
    offset:
      name: offset
      in: query
      description: Number of results to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    id:
      name: id
      in: path
      required: true
      description: Workday ID (WID) of the resource
      schema:
        type: string
      example: 11111111-2222-3333-4444-555555555555
    limit:
      name: limit
      in: query
      description: Maximum number of results to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  responses:
    Unauthorized:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication. Register an API client in Workday, grant recruiting scopes, and obtain access tokens.
      flows:
        authorizationCode:
          authorizationUrl: https://{tenant}.workday.com/authorize
          tokenUrl: https://{tenant}.workday.com/ccx/oauth2/token
          scopes:
            recruiting:read: Read recruiting data
            recruiting:write: Modify recruiting data
externalDocs:
  description: Workday Recruiting REST API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/restapi/index.html
